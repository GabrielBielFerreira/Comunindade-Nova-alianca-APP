name: nova_alianca_app
description: "Nova Aliança App — plataforma digital da Comunidade Nova Aliança (Olinda-PE)"
publish_to: 'none'

version: 1.3.0+10

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Localização (calendário/date picker em pt_BR, etc.)
  flutter_localizations:
    sdk: flutter

  # Domínio compartilhado com o painel web (igrejas, perfis, permissões,
  # contrato financeiro). Fonte única da matriz de autorização.
  nova_alianca_core:
    path: packages/nova_alianca_core

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

  # Estado
  flutter_riverpod: ^2.5.1

  # Navegação
  go_router: ^14.2.7

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  lucide_icons: ^0.257.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # HTTP / API Bíblica
  http: ^1.2.2
  dio: ^5.7.0

  # Storage local
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Utilidades
  intl: ^0.20.2
  uuid: ^4.5.1
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  image_picker: ^1.2.3
  mask_text_input_formatter: ^2.9.0

  # WebView (Mercado Pago Checkout)
  webview_flutter: ^4.10.0

  # QR Code (PIX)
  qr_flutter: ^4.1.0

  # Compartilhamento
  share_plus: ^10.0.2

  # Acessibilidade: busca por voz (fala → texto)
  speech_to_text: ^7.0.0

  # Lembretes locais de eventos
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    # Fontes Montserrat/Inter empacotadas (estáticas, geradas a partir das
    # fontes variáveis oficiais OFL). O google_fonts as usa localmente em vez
    # de baixá-las — app mais rápido e funciona offline no primeiro acesso.
    - assets/fonts/
    - assets/images/
    - assets/images/figma/
    - assets/images/figma/auth/
    - assets/images/figma/home/
    - assets/images/figma/church/
    - assets/images/figma/welcome/
    - assets/images/figma/avisos/
    - assets/images/figma/programacao/
    - assets/images/figma/oracao/
    - assets/images/figma/contribuir/
    - assets/images/figma/profile/
    - assets/images/figma/church/church_map.png
    - assets/images/figma/church/church_map_pin.svg
    - assets/images/figma/church/church_modal_close.svg
    - assets/images/figma/church/church_modal_location.svg
    - assets/images/figma/church/select_back.svg
    - assets/images/figma/church/select_chevron.svg
    - assets/images/figma/church/select_location.svg
    - assets/images/figma/church/select_search.svg
    - assets/images/figma/welcome/welcome_check.svg
    - assets/images/figma/welcome/welcome_logo.png
    - assets/hinos/
